[package]
name = "wow-forever-sim-native"
version = "0.1.0"
description = "WoW: Forever Warrior DPS Simulator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
sim-core = { path = "../crates/sim-core", features = ["parallel"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
